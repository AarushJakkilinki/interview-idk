.tag{position:absolute;left:10px;bottom:10px;background:rgba(20,20,18,.75);color:#fff;font-size:.78rem;padding:.3rem .6rem;border-radius:7px}
.recd{position:absolute;left:10px;top:10px;background:rgba(20,20,18,.75);color:#fff;font-size:.75rem;padding:.25rem .55rem;border-radius:99px;display:flex;gap:6px;align-items:center}
.recd b{width:8px;height:8px;border-radius:9px;background:#e5484d;animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.25}}
.wave{display:flex;align-items:flex-end;gap:3px;height:40px}
.bar{width:4px;border-radius:2px;background:var(--mute);height:4px}
#mouth,.eye{transform-box:fill-box;transform-origin:center}
.talk #mouth{animation:m .26s infinite alternate}
@keyframes m{from{transform:scaleY(1)}to{transform:scaleY(4.5)}}
.eye{animation:b 5s infinite}

.stage.talk{box-shadow:inset 0 0 0 3px var(--good)}
.hard{border-color:var(--bad)!important;animation:t 1.5s infinite}

.cap{min-height:96px;font-size:.95rem;width:100%;background:transparent;color:var(--ink);outline:none;resize:none}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

const STOP=new Set('about would could should their there which where what when have your with that this from into tell describe walk through time give example how you the and for are'.split(' '));

    hedge:low.match(/\b(i think|maybe|kind of|sort of|i guess|probably|hopefully|i suppose|a little bit)\b/g)||[],
    rep:(low.match(/\b(\w{2,})\s+\1\b/g)||[]).length,

  }
  // Articulation
  const artic=ok?cl(100-Math.min(55,fr*7)-Math.min(20,pauses*4)-Math.min(10,rep*2)):0;let aw=[],af=[];
  const top=Object.entries(ans.reduce((o,a)=>{Object.entries(a.fill).forEach(([k,v])=>o[k]=(o[k]||0)+v);return o},{})).filter(e=>e[1]).sort((a,b)=>b[1]-a[1]).map(e=>`"${e[0]}" x${e[1]}`).join(', ');
  if(!ok){aw=none;af=nof}else{
    if(fr>2){aw.push(`${fc} filler words, ${fr.toFixed(1)} per 100 words (${top}).`);af.push('Replace fillers with a silent one-second pause. Practice by recording 60-second answers and replaying them.')}
    if(pauses>0){aw.push(`${pauses} mid-answer pause${pauses>1?'s':''} longer than 2.5 seconds.`);af.push('Use a signpost such as "There are three parts to this" to buy thinking time without dead air.')}
    if(rep>1){aw.push(`You repeated the same word back to back ${rep} times.`);af.push('Finish the thought before speaking, and slow down slightly when a sentence gets complex.')}
  }
  // Confidence
  const conf=ok?cl(100-Math.min(35,hr*6)-Math.min(20,Math.max(0,delay-4)*4)-Math.min(20,skipped*7)-(avgW<50?15:0)-(frame!==null&&frame<70?(70-frame)*.3:0)):0;let kw=[],kf=[];
  if(!ok){kw=none;kf=nof}else{
    if(hr>1.5){const h={};ans.forEach(a=>a.hedge.forEach(x=>h[x]=(h[x]||0)+1));kw.push(`Hedging language appeared ${hedges} times (${Object.entries(h).map(e=>`"${e[0]}" x${e[1]}`).join(', ')}).`);kf.push('Replace "I think maybe we" with a direct claim followed by evidence: "I chose X because Y."')}
    if(delay>4){kw.push(`You took an average of ${delay.toFixed(1)} seconds to start speaking.`);kf.push('Take one breath, then open with the headline of your answer. You can add detail afterward.')}
    if(skipped){kw.push(`Skipping ${skipped} question${skipped>1?'s':''} signals low readiness.`);kf.push('Buy time with "Let me think for a moment" and then structure your answer aloud.')}
    if(ans.some(a=>a.trail)){kw.push('At least one answer trailed off with "so yeah" or "I guess".');kf.push('End on your result, say nothing more, and let the silence do the work.')}
    if(frame!==null&&frame<70){kw.push(`You were centered in frame only ${frame}% of the time.`);kf.push('Set the camera at eye level and look at the lens, not the screen, when making key points.')}
  }
  const overall=cl(content*.4+pacing*.2+artic*.2+conf*.2);
  const secs4=[['Content and relevance',content],['Pacing',pacing],['Articulation',artic],['Confidence',conf]];
  const worst=[...secs4].sort((a,b)=>a[1]-b[1]).slice(0,2).map(s=>s[0]);
  const fixMap={'Content and relevance':cf,Pacing:pf,Articulation:af,Confidence:kf};
  const prio=worst.map(n=>fixMap[n][0]).filter(Boolean);
  const bA=ans.filter(a=>a.t==='b'),Rr=54,C=2*Math.PI*Rr;
  app.innerHTML=`<section class="fade space-y-4">
  <div class="card p-5 sm:p-7 flex flex-col sm:flex-row items-center gap-6">
    <div class="relative w-36 h-36 shrink-0"><svg viewBox="0 0 128 128" class="w-36 h-36 -rotate-90"><circle cx="64" cy="64" r="${Rr}" stroke="var(--soft)" stroke-width="10" fill="none"/>
    <circle id="ring" cx="64" cy="64" r="${Rr}" stroke="var(--ink)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.1s ease"/></svg>
    <div class="absolute inset-0 grid place-items-center text-center"><div><div class="text-4xl font-semibold">${overall}</div><div class="text-xs mute">out of 100</div></div></div></div>
    <div><h2 class="text-xl">${!ok?'No speech captured':overall>=80?'Strong interview':overall>=60?'Solid, with clear gaps':'Needs focused practice'}</h2>
    <p class="mute text-sm mt-1">${esc(role())} at ${esc(compName())}. ${N-skipped} of ${N} questions answered, ${tot} words spoken${wpm?`, ${wpm} WPM`:''}. Scores come from your actual transcript and timing. Voice tone and eye gaze are not analysed.</p>
    ${prio.length?`<p class="text-sm mt-2"><b>Fix first:</b> ${prio.join(' ')}</p>`:''}</div></div>
  ${!ok?'<div class="card p-5 bad text-sm">Nothing was heard from your microphone. Check browser permissions and that you are using Chrome or Edge, then retake the interview.</div>':''}
  <h3 class="pt-2">Performance breakdown</h3>
  ${sec('Content and relevance',content,`${Math.round(avgW)} words per answer on average. Judged on length, structure, specifics, and relevance to the question.`,cw,cf)}
  ${sec('Pacing',pacing,`${wpm||'No'} words per minute overall. The target range is 130 to 160.`,pw,pf)}
  ${sec('Articulation',artic,`${fc} fillers, ${pauses} long pauses, ${rep} repeated words. Browser captions often drop "um" and "uh", so your true filler count may be higher.`,aw,af)}
  ${sec('Confidence',conf,`Estimated from hedging, start delay (${delay?delay.toFixed(1)+'s':'n/a'}), completion, and camera framing (${frame!==null?frame+'% centered':'camera off or unsupported, not measured'}).`,kw,kf)}
  <div class="card p-5"><h3>Filler words and pauses</h3><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3">
    ${['um','uh','like','you know'].map(k=>{const v=ans.reduce((s,a)=>s+a.fill[k],0);return `<div class="rounded-lg p-3 text-center" style="background:var(--soft)"><div class="text-2xl font-semibold">${v}</div><div class="text-xs mute">"${k}"</div></div>`}).join('')}</div>
    <p class="mute text-sm mt-3">${pauses} pause${pauses===1?'':'s'} over 2.5 seconds flagged. "Like" is counted even when used correctly, so treat it as an upper bound.</p></div>
  <div class="card p-5"><h3>STAR matrix</h3><p class="mute text-sm">Share of behavioral answers containing each element (${bA.length} evaluated).</p>
    <div class="grid grid-cols-2 gap-3 mt-3">${[['S','Situation'],['T','Task'],['A','Action'],['R','Result']].map(([k,n])=>{const p=bA.length?Math.round(bA.filter(a=>a.st[k]).length/bA.length*100):null;
    return `<div class="rounded-lg p-3" style="background:var(--soft)"><div class="flex justify-between text-sm"><b>${n}</b><span class="${p!==null&&p<50?'bad':'good'}">${p===null?'n/a':p+'%'}</span></div><div class="text-xs mute mt-1">${p===null?'No behavioral answers this session.':p>=50?'Present in most answers.':'Often missing. See the fix above.'}</div></div>`}).join('')}</div></div>
  <div class="card p-5"><h3 class="mb-3">Question review and rewrites</h3><div class="space-y-2">${R.map((a,i)=>{
    const iss=[];if(!a.n)iss.push(a.skipped?'Skipped.':'No speech captured.');else{
      if(a.n<50)iss.push(`Short answer (${a.n} words).`);if(a.fc>2)iss.push(`${a.fc} filler words.`);if(a.pauses)iss.push(`${a.pauses} long pause${a.pauses>1?'s':''}.`);
      if(a.t==='b'){const m=Object.entries({S:'Situation',T:'Task',A:'Action',R:'Result'}).filter(e=>!a.st[e[0]]).map(e=>e[1]);if(m.length)iss.push('Missing: '+m.join(', ')+'.')}
      if(!a.num)iss.push('No measurable figure.')}
    return `<details class="rounded-lg border" style="border-color:var(--line)"><summary class="p-3 flex justify-between gap-3 text-sm"><span><span class="mute">Q${i+1}</span> ${a.r?'<span class="chip on" style="padding:.05rem .5rem;font-size:.7rem">From your resume</span> ':''}${esc(a.q)}</span><span class="chev mute">&#9662;</span></summary>
    <div class="px-3 pb-3 space-y-3 text-sm"><div><h4 style="margin-top:0">Your transcript${a.wpm?` (${a.n} words, ${a.wpm} WPM)`:''}</h4><p>${a.text?esc(a.text):'<span class="mute">Nothing captured.</span>'}</p></div>
    ${iss.length?`<div><h4 style="margin-top:0">Feedback</h4>${ul(iss)}</div>`:'<p class="good">This answer had no major issues.</p>'}
    <div class="rounded-lg p-3" style="background:var(--soft)"><h4 style="margin-top:0">Suggested stronger response</h4><p>${model(a)}</p></div></div></details>`}).join('')}</div></div>
  <button id="retake" class="btn">Retake interview</button></section>`;
  requestAnimationFrame(()=>setTimeout(()=>{const r=$('#ring');if(r)r.style.strokeDashoffset=C*(1-overall/100)},80));
  $('#retake').onclick=setup;
}
setup();
</script>
</body>
</html>
